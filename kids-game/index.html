<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6fd3ff">
<title>AI Kids Play</title>
<style>
  :root {
    --sky1: #6fd3ff; --sky2: #b8f0ff; --ink: #263247;
    --card: #ffffff; --accent: #ff7ab8; --good: #3ccf7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky1), var(--sky2));
  }
  .screen { position: absolute; inset: 0; display: none; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; flex-direction: column; align-items: center; }

  /* top bar */
  .bar { width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 72px; z-index: 5; }
  .round-btn {
    width: 72px; height: 72px; border-radius: 50%; border: none; background: #fff;
    font-size: 38px; box-shadow: 0 6px 0 rgba(0,0,0,.15); cursor: pointer;
  }
  .round-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .stars { font-size: 34px; background: rgba(255,255,255,.7); border-radius: 40px; padding: 6px 18px; min-width: 120px; text-align: center; }

  /* home */
  #home h1 { font-size: clamp(36px, 8vw, 72px); margin: 8px 0 0; color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .cast { display: flex; gap: 10px; margin: 12px 0 20px; flex-wrap: wrap; justify-content: center; }
  .cast .face { width: clamp(56px, 12vw, 96px); height: clamp(56px, 12vw, 96px); animation: bob 2s ease-in-out infinite; }
  .cast .face:nth-child(2n) { animation-delay: .4s; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; width: min(900px, 100%); flex: 1; align-content: center; }
  .menu button {
    border: none; border-radius: 32px; min-height: 180px; font-size: 90px; cursor: pointer;
    box-shadow: 0 10px 0 rgba(0,0,0,.15); color: #fff;
  }
  .menu button:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .menu .b1 { background: #ff8fab; } .menu .b2 { background: #8f7bff; } .menu .b3 { background: #ffb547; }

  /* balloons */
  #balloonField { position: relative; flex: 1; width: 100%; overflow: hidden; }
  .balloon { position: absolute; width: 120px; height: 150px; touch-action: none; cursor: pointer; }
  .balloon .skin { position: absolute; inset: 0 0 30px 0; border-radius: 50% 50% 48% 48%; box-shadow: inset -10px -14px 0 rgba(0,0,0,.12); }
  .balloon .face { position: absolute; left: 18px; top: 14px; width: 84px; height: 84px; }
  .balloon .string { position: absolute; left: 59px; bottom: 0; width: 2px; height: 32px; background: rgba(0,0,0,.35); }
  .pop { position: absolute; font-size: 64px; pointer-events: none; animation: burst .5s ease-out forwards; }

  /* memory */
  #memGrid { flex: 1; width: min(720px, 100%); display: grid; gap: 12px; align-content: center; }
  .mcard { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .mcard .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
  .mcard.flip .in { transform: rotateY(180deg); }
  .mcard .front, .mcard .back { position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  .mcard .back { background: repeating-linear-gradient(45deg, #8f7bff, #8f7bff 12px, #a594ff 12px, #a594ff 24px); font-size: 48px; color: #fff; }
  .mcard .front { background: #fff; transform: rotateY(180deg); }
  .mcard .front .face { width: 80%; height: 80%; }
  .mcard.done .front { box-shadow: 0 0 0 6px var(--good), 0 6px 0 rgba(0,0,0,.15); }

  /* find */
  #findTarget { width: clamp(120px, 26vw, 200px); height: clamp(120px, 26vw, 200px); background: #fff; border-radius: 50%; padding: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.12); cursor: pointer; }
  #findTarget .face { width: 100%; height: 100%; }
  #findChoices { flex: 1; width: min(760px, 100%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-content: center; padding-top: 16px; }
  .choice { aspect-ratio: 1.3; background: #fff; border: none; border-radius: 28px; box-shadow: 0 8px 0 rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .choice .face { width: 70%; height: 90%; }
  .choice.wrong { animation: shake .4s; }
  .choice.right { background: #d8ffe7; }

  /* celebration */
  #party { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(255,255,255,.55); z-index: 20; }
  #party.on { display: flex; }
  #party .big { font-size: 140px; animation: bob 1s ease-in-out infinite; }
  .confetti { position: fixed; top: -20px; width: 14px; height: 20px; z-index: 21; pointer-events: none; animation: fall linear forwards; }

  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @keyframes burst { from { transform: scale(.5); opacity: 1 } to { transform: scale(1.8); opacity: 0 } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-12px) } 75% { transform: translateX(12px) } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg) } }
  @media (orientation: landscape) and (max-height: 500px) {
    .menu button { min-height: 120px; font-size: 64px; }
    #findChoices { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="bar"><span></span><button class="round-btn" id="soundBtn" aria-label="Sound">🔊</button></div>
  <h1>AI Kids Play</h1>
  <div class="cast" id="cast"></div>
  <div class="menu">
    <button class="b1" data-go="balloons" aria-label="Balloon pop">🎈</button>
    <button class="b2" data-go="memory" aria-label="Memory match">🃏</button>
    <button class="b3" data-go="find" aria-label="Find the friend">🔍</button>
  </div>
</section>

<!-- BALLOON POP -->
<section id="balloons" class="screen">
  <div class="bar"><button class="round-btn" data-home aria-label="Home">🏠</button><div class="stars" id="balloonStars">⭐ 0</div><span style="width:72px"></span></div>
  <div id="balloonField"></div>
</section>

<!-- MEMORY MATCH -->
<section id="memory" class="screen">
  <div class="bar"><button class="round-btn" data-home aria-label="Home">🏠</button><div class="stars" id="memStars"></div><button class="round-btn" id="memAgain" aria-label="New game">🔄</button></div>
  <div id="memGrid"></div>
</section>

<!-- FIND THE FRIEND -->
<section id="find" class="screen">
  <div class="bar"><button class="round-btn" data-home aria-label="Home">🏠</button><div class="stars" id="findStars">⭐ 0</div><span style="width:72px"></span></div>
  <div id="findTarget" aria-label="Who to find"></div>
  <div id="findChoices"></div>
</section>

<div id="party"><div class="big">🏆</div></div>

<script>
/* =========================================================
   CHARACTERS: swap these for the AI Kids video characters.
   - name:  spoken aloud by the game (kids don't need to read)
   - color: their signature color (balloons, card glow)
   - image: path to a PNG/SVG with transparent background,
            e.g. "characters/luna.png". Leave null to use the
            built-in placeholder face.
   ========================================================= */
const CHARACTERS = [
  { name: "Robo",  color: "#4fb3ff", image: null },
  { name: "Luna",  color: "#ff7ab8", image: null },
  { name: "Ziggy", color: "#ffb547", image: null },
  { name: "Pixel", color: "#3ccf7a", image: null },
  { name: "Nova",  color: "#9b7bff", image: null },
  { name: "Bolt",  color: "#ff6b5e", image: null },
];

/* ---------- character art ---------- */
function placeholderSVG(c, i) {
  // simple friendly robot-kid face, varied by index
  const ears = i % 2 === 0
    ? `<circle cx="12" cy="50" r="9" fill="${c.color}"/><circle cx="88" cy="50" r="9" fill="${c.color}"/>`
    : `<line x1="50" y1="14" x2="50" y2="2" stroke="#263247" stroke-width="3"/><circle cx="50" cy="4" r="5" fill="#ffd84d"/>`;
  const mouth = ["M35 66 Q50 80 65 66", "M38 68 Q50 74 62 68", "M36 64 Q50 84 64 64"][i % 3];
  return `<svg class="face" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    ${ears}
    <rect x="16" y="16" width="68" height="70" rx="30" fill="${c.color}"/>
    <rect x="24" y="30" width="52" height="44" rx="20" fill="#fff"/>
    <circle cx="40" cy="48" r="7" fill="#263247"/><circle cx="60" cy="48" r="7" fill="#263247"/>
    <circle cx="42" cy="45" r="2.5" fill="#fff"/><circle cx="62" cy="45" r="2.5" fill="#fff"/>
    <circle cx="31" cy="60" r="4" fill="#ffb3c7"/><circle cx="69" cy="60" r="4" fill="#ffb3c7"/>
    <path d="${mouth}" stroke="#263247" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function faceHTML(i) {
  const c = CHARACTERS[i];
  return c.image
    ? `<img class="face" src="${c.image}" alt="${c.name}" draggable="false" style="object-fit:contain">`
    : placeholderSVG(c, i);
}

/* ---------- sound & voice ---------- */
let soundOn = true, actx = null;
function beep(freq = 600, dur = 0.12, type = "sine", vol = 0.2) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  pop:  () => { beep(880, .08, "triangle"); setTimeout(() => beep(1320, .08, "triangle"), 60); },
  flip: () => beep(500, .06, "square", .08),
  yes:  () => [523, 659, 784].forEach((f, k) => setTimeout(() => beep(f, .15), k * 100)),
  no:   () => beep(220, .2, "sawtooth", .08),
  win:  () => [523, 659, 784, 1047, 784, 1047].forEach((f, k) => setTimeout(() => beep(f, .18), k * 120)),
};
function say(text) {
  if (!soundOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.pitch = 1.3;
  speechSynthesis.speak(u);
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const onTap = (el, fn) => el.addEventListener("pointerdown", e => { e.preventDefault(); fn(e); });

function celebrate(after) {
  sfx.win(); say("Hooray! Great job!");
  $("#party").classList.add("on");
  const colors = CHARACTERS.map(c => c.color);
  for (let i = 0; i < 60; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = rand(0, 100) + "vw";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = rand(1.5, 3) + "s";
    d.style.animationDelay = rand(0, .5) + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4000);
  }
  setTimeout(() => { $("#party").classList.remove("on"); after && after(); }, 2600);
}

/* ---------- navigation ---------- */
let current = "home";
function show(id) {
  stopBalloons();
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  current = id;
  if (id === "balloons") startBalloons();
  if (id === "memory") startMemory();
  if (id === "find") startFind();
}
document.querySelectorAll("[data-go]").forEach(b => onTap(b, () => { sfx.flip(); show(b.dataset.go); }));
document.querySelectorAll("[data-home]").forEach(b => onTap(b, () => { sfx.flip(); show("home"); }));
onTap($("#soundBtn"), () => { soundOn = !soundOn; $("#soundBtn").textContent = soundOn ? "🔊" : "🔇"; if (!soundOn) speechSynthesis?.cancel(); });

// home cast: tap a character to hear their name
$("#cast").innerHTML = CHARACTERS.map((_, i) => `<div data-i="${i}">${faceHTML(i)}</div>`).join("");
$("#cast").querySelectorAll("[data-i]").forEach(el => onTap(el, () => { sfx.pop(); say("Hi! I'm " + CHARACTERS[el.dataset.i].name); }));

/* =========================================================
   GAME 1: BALLOON POP. Tap the floating balloons. 20 pops = party.
   ========================================================= */
let bTimer = null, bFrame = null, bScore = 0, balloons = [];
const B_GOAL = 20;
function startBalloons() {
  bScore = 0; updateBStars();
  $("#balloonField").innerHTML = ""; balloons = [];
  bTimer = setInterval(spawnBalloon, 900);
  spawnBalloon();
  let last = performance.now();
  const tick = now => {
    const dt = (now - last) / 1000; last = now;
    const h = $("#balloonField").clientHeight;
    balloons = balloons.filter(b => {
      b.y -= b.speed * dt; b.t += dt;
      b.el.style.transform = `translate(${b.x + Math.sin(b.t * 2) * 12}px, ${b.y}px)`;
      if (b.y < -170) { b.el.remove(); return false; }
      return true;
    });
    bFrame = requestAnimationFrame(tick);
  };
  bFrame = requestAnimationFrame(tick);
}
function stopBalloons() { clearInterval(bTimer); cancelAnimationFrame(bFrame); }
function spawnBalloon() {
  const field = $("#balloonField");
  const i = Math.floor(Math.random() * CHARACTERS.length);
  const el = document.createElement("div");
  el.className = "balloon";
  el.innerHTML = `<div class="skin" style="background:${CHARACTERS[i].color}"></div>${faceHTML(i)}<div class="string"></div>`;
  const b = { el, i, x: rand(0, Math.max(0, field.clientWidth - 120)), y: field.clientHeight + 10, speed: rand(70, 130), t: rand(0, 6) };
  el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  onTap(el, e => popBalloon(b, e));
  field.appendChild(el); balloons.push(b);
}
function popBalloon(b, e) {
  sfx.pop();
  const r = $("#balloonField").getBoundingClientRect();
  const p = document.createElement("div");
  p.className = "pop"; p.textContent = "💥";
  p.style.left = (e.clientX - r.left - 32) + "px"; p.style.top = (e.clientY - r.top - 32) + "px";
  $("#balloonField").appendChild(p); setTimeout(() => p.remove(), 500);
  b.el.remove(); balloons = balloons.filter(x => x !== b);
  bScore++; updateBStars();
  if (bScore % 5 === 0 && bScore < B_GOAL) say(CHARACTERS[b.i].name + " says wow!");
  if (bScore >= B_GOAL) { stopBalloons(); celebrate(() => current === "balloons" && startBalloons()); }
}
function updateBStars() { $("#balloonStars").textContent = "⭐ " + bScore; }

/* =========================================================
   GAME 2: MEMORY MATCH. Flip two cards, find the pairs.
   ========================================================= */
let mFirst = null, mLock = false, mPairs = 0, mTotal = 0;
function startMemory() {
  const n = Math.min(6, CHARACTERS.length);
  const picks = shuffle([...CHARACTERS.keys()]).slice(0, n);
  const deck = shuffle([...picks, ...picks]);
  mFirst = null; mLock = false; mPairs = 0; mTotal = n;
  const grid = $("#memGrid");
  layoutMemory();
  grid.innerHTML = deck.map(i => `<div class="mcard" data-i="${i}"><div class="in"><div class="back">✨</div><div class="front">${faceHTML(i)}</div></div></div>`).join("");
  grid.querySelectorAll(".mcard").forEach(c => onTap(c, () => flipCard(c)));
  updateMStars();
}
function layoutMemory() {
  // 4 columns in landscape, 3 in portrait; shrink so all 12 cards fit on screen
  const grid = $("#memGrid");
  const cols = window.innerWidth > window.innerHeight ? 4 : 3;
  const rows = Math.ceil(mTotal * 2 / cols);
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.width = `min(720px, 100%, ${(window.innerHeight - 140) / rows * cols}px)`;
}
function flipCard(c) {
  if (mLock || c.classList.contains("flip")) return;
  c.classList.add("flip"); sfx.flip();
  if (!mFirst) { mFirst = c; return; }
  if (mFirst.dataset.i === c.dataset.i) {
    [mFirst, c].forEach(x => x.classList.add("done"));
    sfx.yes(); say(CHARACTERS[c.dataset.i].name + "!");
    mFirst = null; mPairs++; updateMStars();
    if (mPairs === mTotal) setTimeout(() => celebrate(() => current === "memory" && startMemory()), 500);
  } else {
    mLock = true; const a = mFirst; mFirst = null;
    setTimeout(() => { a.classList.remove("flip"); c.classList.remove("flip"); mLock = false; }, 900);
  }
}
function updateMStars() { $("#memStars").textContent = "⭐".repeat(mPairs) + "☆".repeat(mTotal - mPairs); }
onTap($("#memAgain"), () => { sfx.flip(); startMemory(); });

/* =========================================================
   GAME 3: FIND THE FRIEND. Hear a name, tap that character.
   Tap the big face at the top to hear the name again.
   ========================================================= */
let fTarget = 0, fScore = 0, fBusy = false;
const F_GOAL = 8;
function startFind() { fScore = 0; $("#findStars").textContent = "⭐ 0"; nextFind(); }
function nextFind() {
  fBusy = false;
  const opts = shuffle([...CHARACTERS.keys()]).slice(0, 4);
  fTarget = opts[Math.floor(Math.random() * opts.length)];
  $("#findTarget").innerHTML = faceHTML(fTarget);
  $("#findChoices").innerHTML = opts.map(i => `<button class="choice" data-i="${i}" aria-label="${CHARACTERS[i].name}">${faceHTML(i)}</button>`).join("");
  $("#findChoices").querySelectorAll(".choice").forEach(b => onTap(b, () => pick(b)));
  say("Find " + CHARACTERS[fTarget].name + "!");
}
function pick(b) {
  if (fBusy) return;
  if (+b.dataset.i === fTarget) {
    fBusy = true; b.classList.add("right"); sfx.yes(); say("Yes! " + CHARACTERS[fTarget].name + "!");
    fScore++; $("#findStars").textContent = "⭐ " + fScore;
    if (fScore >= F_GOAL) setTimeout(() => celebrate(() => current === "find" && startFind()), 600);
    else setTimeout(nextFind, 1300);
  } else {
    sfx.no(); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
    say("Try again!");
  }
}
onTap($("#findTarget"), () => say("Find " + CHARACTERS[fTarget].name + "!"));

window.addEventListener("resize", () => { if (current === "memory") layoutMemory(); });
</script>
</body>
</html>
